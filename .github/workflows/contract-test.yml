name: Contract tests (Aqueduct Runner)

# Cross-repo contract tests against the real, unmodified spillway
# image -- proves at the wire level that the shared
# X-Aqueduct-*/X-EZTHROTTLE-* contract with aquifer still holds, not just
# that spillway's own tests pass. See
# github.com/rjpruitt16/aqueduct-runner.
#
# contract-test-drain mirrors aquifer's equivalent job -- both run in
# parallel with the fast checks above so a slow drain-mode regression
# doesn't hold up fast feedback. Confirmed passing end-to-end at ~10m10s
# (roughly double aquifer's ~5m10s, a genuine two-level nested idle wait
# aquifer doesn't have -- see aqueduct-runner's README "Known caveat"
# section). This used to be permanently excluded here: drain mode had a
# real bug (two always-on heartbeats blocking their own idle-timeout from
# ever firing) found via aqueduct-runner's contract tests and fixed in
# commit a65e516.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spillway
        uses: actions/checkout@v4
        with:
          path: spillway

      - name: Pick the aqueduct-runner branch
        id: runner
        env:
          BRANCH: ${{ github.head_ref }}
        # A runner branch with the same name as this PR's branch carries the
        # matching contract change; test against it. Otherwise use main.
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/rjpruitt16/aqueduct-runner "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with aqueduct-runner@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aqueduct-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: aqueduct-runner

      # Dagger occasionally fails to load this module's Python SDK on a cold
      # engine ("failed to load sdk for local module source"), before any
      # test runs. Load it here, with retries, so a setup hiccup doesn't fail
      # the run. The test steps below then reuse the warm engine and run once.
      - name: Load the aqueduct-runner module (retries Dagger setup failures)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" DAGGER_VERSION=0.21.8 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3; do
            if "$HOME/.local/bin/dagger" -m ./aqueduct-runner functions > /dev/null; then
              exit 0
            fi
            echo "::warning::Loading the aqueduct-runner module failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Contract test -- shared suite (health, lifecycle, idempotency, proxy, L8)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-spillway
            --source=./spillway
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- admission rejection
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-spillway-admission
            --source=./spillway
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- L8 request schemas (422 on mismatch)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-spillway-request-schemas
            --source=./spillway
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- shared WebSocket behavior
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-spillway-websocket
            --source=./spillway
            --websocket-dir=./aqueduct-runner/websocket

  # Spillway registering with a real Canalis, and signing its pings so a
  # Canalis that only trusts allowlisted nodes accepts it (alongside a
  # trusted Aquifer, with an unlisted node refused). Its own job: it builds
  # two more repos, no reason to hold up the checks above on it.
  contract-test-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spillway
        uses: actions/checkout@v4
        with:
          path: spillway

      - name: Checkout aquifer
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aquifer
          path: aquifer

      - name: Checkout canalis-rs
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/canalis-rs
          path: canalis-rs

      - name: Pick the aqueduct-runner branch
        id: runner
        env:
          BRANCH: ${{ github.head_ref }}
        # A runner branch with the same name as this PR's branch carries the
        # matching contract change; test against it. Otherwise use main.
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/rjpruitt16/aqueduct-runner "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with aqueduct-runner@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aqueduct-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: aqueduct-runner

      # Dagger occasionally fails to load this module's Python SDK on a cold
      # engine ("failed to load sdk for local module source"), before any
      # test runs. Load it here, with retries, so a setup hiccup doesn't fail
      # the run. The test steps below then reuse the warm engine and run once.
      - name: Load the aqueduct-runner module (retries Dagger setup failures)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" DAGGER_VERSION=0.21.8 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3; do
            if "$HOME/.local/bin/dagger" -m ./aqueduct-runner functions > /dev/null; then
              exit 0
            fi
            echo "::warning::Loading the aqueduct-runner module failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Contract test -- Spillway registers with Canalis
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-spillway-registration
            --spillway-source=./spillway
            --canalis-source=./canalis-rs

      - name: Contract test -- only allowlisted Aquifer and Spillway nodes can register with Canalis
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-signed-registration
            --aquifer-source=./aquifer
            --spillway-source=./spillway
            --canalis-source=./canalis-rs

  # Separate job so a slow drain-mode regression doesn't hold up the fast
  # checks above -- both start immediately, no `needs:` dependency.
  contract-test-drain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spillway
        uses: actions/checkout@v4
        with:
          path: spillway

      - name: Pick the aqueduct-runner branch
        id: runner
        env:
          BRANCH: ${{ github.head_ref }}
        # A runner branch with the same name as this PR's branch carries the
        # matching contract change; test against it. Otherwise use main.
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/rjpruitt16/aqueduct-runner "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with aqueduct-runner@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aqueduct-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: aqueduct-runner

      # Dagger occasionally fails to load this module's Python SDK on a cold
      # engine ("failed to load sdk for local module source"), before any
      # test runs. Load it here, with retries, so a setup hiccup doesn't fail
      # the run. The test steps below then reuse the warm engine and run once.
      - name: Load the aqueduct-runner module (retries Dagger setup failures)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" DAGGER_VERSION=0.21.8 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3; do
            if "$HOME/.local/bin/dagger" -m ./aqueduct-runner functions > /dev/null; then
              exit 0
            fi
            echo "::warning::Loading the aqueduct-runner module failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      # Genuinely takes ~10 minutes -- roughly double aquifer's ~5, a
      # genuine two-level nested idle wait aquifer doesn't have. See
      # aqueduct-runner's README "Known caveat" section.
      - name: Contract test -- drain-mode ledger (~10 min)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-spillway-drain
            --source=./spillway
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder
