# CodeRabbit settings for this repository. inheritance keeps the
# organization's settings and adds these instructions on top.
inheritance: true
reviews:
  path_instructions:
    - path: "lib/**/*.ex"
      instructions: |
        Treat anything that can make memory, goroutines/processes, file descriptors or Valkey/Redis data grow without a bound as a **major** finding, and title it "Possible memory leak". This project runs long-lived servers that were soak-tested for a week, and a leak would mean repeating that test. For each one, say what grows, what would bound it, and which test or metric would show it.
        Look for:
        - GenServer state, ETS tables or :persistent_term entries that only grow: no eviction, TTL or size cap;
        - processes spawned per request, job or session without a supervisor, monitor or exit path, and links/monitors never cleaned up;
        - mailboxes that can grow without bound (casts or sends faster than the receiver handles them, no backpressure);
        - per-session, per-user or per-queue state not removed on disconnect, crash or idle paths;
        - :timer/Process.send_after loops that are never cancelled;
        - large binaries kept alive by sub-binary references;
        - RocksDB iterators, sockets or files not closed;
        - Valkey keys or streams written without an expiry or MAXLEN.
